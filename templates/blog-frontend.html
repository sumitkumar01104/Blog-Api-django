<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SK Blog</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b4bff'/%3E%3Cstop offset='1' stop-color='%23c026d3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='28' text-anchor='middle' fill='white'%3ESK%3C/text%3E%3C/svg%3E" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f6f6fb;
      --surface: #ffffff;
      --surface2: #efeff7;
      --border: #e3e3ee;
      --accent: #5b4bff;
      --accent-dark: #4636e0;
      --accent2: #0d9488;
      --text: #14141f;
      --text2: #55556a;
      --text3: #8c8ca2;
      --danger: #d93a4a;
      --like: #ef476f;
      --shadow: 0 8px 24px rgba(40, 30, 110, 0.08);
      --radius: 14px;
      --font-head: 'Sora', 'Inter', sans-serif;
      --font: 'Inter', system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d15;
        --surface: #16161f;
        --surface2: #1d1d2a;
        --border: #2a2a3b;
        --accent: #7b6dff;
        --accent-dark: #6a5bf2;
        --accent2: #2dd4bf;
        --text: #ececf5;
        --text2: #a5a5bb;
        --text3: #707088;
        --danger: #ff6b78;
        --like: #ff6b8e;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* NAV */
    nav {
      background: color-mix(in srgb, var(--surface) 85%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-head);
      font-size: 19px; font-weight: 700;
      color: var(--text);
      cursor: pointer; user-select: none;
    }
    .logo-mark {
      width: 36px; height: 36px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #5b4bff 0%, #c026d3 100%);
      color: #fff; font-size: 14px; font-weight: 700; letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(91, 75, 255, 0.35);
    }
    .logo-text { color: var(--text2); font-weight: 600; }
    .nav-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

    /* BUTTONS */
    .btn {
      padding: 9px 18px; border-radius: 10px; font-size: 13px; font-weight: 600;
      border: none; cursor: pointer; font-family: var(--font); transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dark); transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); }
    .btn-danger:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }
    .btn-sm { padding: 6px 13px; font-size: 12px; }
    .btn-icon { padding: 5px 9px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* LAYOUT */
    .container { max-width: 760px; margin: 0 auto; padding: 36px 20px 40px; }

    /* HERO */
    .hero {
      background:
        radial-gradient(circle at 85% 20%, rgba(255, 255, 255, 0.22) 0, transparent 42%),
        linear-gradient(135deg, #5b4bff 0%, #9333ea 55%, #c026d3 100%);
      border-radius: 20px;
      padding: 40px 36px;
      color: #fff;
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: ''; position: absolute; right: -50px; bottom: -70px;
      width: 220px; height: 220px; border-radius: 50%;
      border: 36px solid rgba(255, 255, 255, 0.12);
    }
    .hero h1 { font-family: var(--font-head); font-size: 34px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.5px; }
    .hero p { font-size: 15px; opacity: 0.92; line-height: 1.65; max-width: 460px; position: relative; z-index: 1; }
    .hero .btn { margin-top: 20px; background: #fff; color: #4636e0; position: relative; z-index: 1; }
    .hero .btn:hover { background: #f1eeff; }

    /* AUTH PAGES */
    .auth-wrap {
      min-height: calc(100vh - 200px);
      display: flex; align-items: center; justify-content: center;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      width: 100%; max-width: 420px;
      box-shadow: var(--shadow);
    }
    .auth-card h2 { font-family: var(--font-head); font-size: 26px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.3px; }
    .auth-card p.sub { color: var(--text2); font-size: 14px; margin-bottom: 28px; }

    /* FORMS */
    .form-group { margin-bottom: 16px; }
    label { font-size: 12px; font-weight: 600; color: var(--text2); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.6px; }
    input[type=text], input[type=password], textarea {
      width: 100%; background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text); font-family: var(--font); font-size: 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    input::placeholder, textarea::placeholder { color: var(--text3); }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
    textarea { resize: vertical; min-height: 100px; }

    /* MESSAGES */
    .error-msg {
      background: color-mix(in srgb, var(--danger) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
      color: var(--danger);
      border-radius: 10px; padding: 10px 14px;
      font-size: 13px; margin-bottom: 16px;
    }
    .success-msg {
      background: color-mix(in srgb, var(--accent2) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent2) 35%, transparent);
      color: var(--accent2);
      border-radius: 10px; padding: 10px 14px;
      font-size: 13px; margin-bottom: 16px;
    }

    /* POST CARDS */
    .post-list { display: flex; flex-direction: column; gap: 16px; }
    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      transition: all 0.18s;
      position: relative;
    }
    .post-card::before {
      content: ''; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px;
      border-radius: 0 3px 3px 0; background: var(--accent); opacity: 0; transition: opacity 0.18s;
    }
    .post-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
    .post-card:hover::before { opacity: 1; }
    .post-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, #5b4bff, #c026d3);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: #fff; flex-shrink: 0;
    }
    .post-author { font-size: 13px; font-weight: 600; color: var(--text); }
    .post-date { font-size: 12px; color: var(--text3); margin-left: auto; }
    .post-card h3 {
      font-family: var(--font-head);
      font-size: 20px; font-weight: 600; margin-bottom: 8px;
      cursor: pointer; transition: color 0.15s; line-height: 1.35; letter-spacing: -0.2px;
    }
    .post-card h3:hover { color: var(--accent); }
    .post-body { font-size: 14px; color: var(--text2); line-height: 1.7; margin-bottom: 16px; }
    .post-body.preview {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-clamp: 3;
    }
    .post-footer { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .like-btn {
      display: flex; align-items: center; gap: 6px;
      background: none; border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 14px;
      color: var(--text2); font-size: 13px; cursor: pointer; font-family: var(--font);
      transition: all 0.15s;
    }
    .like-btn:hover { color: var(--like); border-color: var(--like); background: color-mix(in srgb, var(--like) 8%, transparent); }
    .comment-count {
      display: flex; align-items: center; gap: 6px;
      color: var(--text3); font-size: 13px; cursor: pointer;
    }
    .comment-count:hover { color: var(--accent); }
    .owner-actions { margin-left: auto; display: flex; gap: 8px; }

    /* DETAIL VIEW */
    .post-detail { max-width: 720px; margin: 0 auto; }
    .back-btn {
      background: none; border: none; color: var(--text2); cursor: pointer;
      font-size: 13px; font-weight: 500; font-family: var(--font); display: flex; align-items: center; gap: 6px;
      margin-bottom: 24px; padding: 0;
    }
    .back-btn:hover { color: var(--accent); }
    .post-detail h2 { font-family: var(--font-head); font-size: 32px; font-weight: 700; margin-bottom: 12px; line-height: 1.25; letter-spacing: -0.5px; }
    .post-full-body { font-size: 16px; line-height: 1.85; color: var(--text); white-space: pre-wrap; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

    /* COMMENTS */
    .comments-section h4 { font-family: var(--font-head); font-size: 17px; font-weight: 600; margin-bottom: 16px; }
    .comment-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .comment-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .comment-author { font-size: 12px; font-weight: 600; color: var(--accent2); }
    .comment-time { font-size: 11px; color: var(--text3); margin-left: auto; }
    .comment-text { font-size: 14px; color: var(--text2); line-height: 1.6; }
    .comment-form { margin-top: 20px; display: flex; gap: 10px; }
    .comment-form textarea { flex: 1; min-height: 60px; }
    .login-hint {
      margin-top: 16px; padding: 14px 16px;
      background: var(--surface2); border: 1px dashed var(--border);
      border-radius: 12px; color: var(--text2); font-size: 13px;
    }
    .login-hint a { color: var(--accent); font-weight: 600; text-decoration: none; cursor: pointer; }

    /* NEW POST */
    .new-post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 28px;
    }
    .new-post-card h3 { font-family: var(--font-head); font-size: 20px; font-weight: 600; margin-bottom: 20px; }

    /* HEADER */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .page-header h1 { font-family: var(--font-head); font-size: 24px; font-weight: 700; letter-spacing: -0.4px; }
    .user-badge {
      display: flex; align-items: center; gap: 4px;
      background: var(--surface2); border-radius: 999px; padding: 6px 14px;
      font-size: 13px; color: var(--text2);
    }
    .user-badge .name { color: var(--accent); font-weight: 600; }

    /* EMPTY STATE */
    .empty { text-align: center; padding: 60px 20px; color: var(--text3); }
    .empty-icon { font-size: 44px; margin-bottom: 12px; }
    .empty p { font-size: 14px; }

    /* FOOTER */
    .site-footer { text-align: center; color: var(--text3); font-size: 12px; padding: 8px 20px 36px; }

    /* SPINNER */
    .spinner {
      width: 22px; height: 22px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* TOAST (kept in a separate root so typing isn't wiped on re-render) */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--surface); border: 1px solid var(--border);
      border-left: 4px solid var(--accent2);
      border-radius: 12px; padding: 12px 18px;
      font-size: 13px; color: var(--text);
      box-shadow: var(--shadow);
      z-index: 999;
      animation: slideUp 0.2s ease;
    }
    .toast.error { border-left-color: var(--danger); }
    @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    @media (max-width: 600px) {
      .auth-card { padding: 28px 20px; }
      nav { padding: 0 12px; height: auto; min-height: 60px; padding-top: 8px; padding-bottom: 8px; }
      .hero { padding: 28px 22px; }
      .hero h1 { font-size: 26px; }
      .post-detail h2 { font-size: 25px; }
    }
  </style>
</head>
<body>

<div id="app"></div>
<div id="toast-root"></div>

<script>
// ==================== STATE ====================
let state = {
  view: 'feed',            // login | register | feed | detail | my-posts | new-post | edit-post
  token: localStorage.getItem('access') || null,
  refresh: localStorage.getItem('refresh') || null,
  user: localStorage.getItem('user') || null,
  posts: [],
  currentPost: null,
  loading: false,
  error: null,
  success: null,
  apiBase: localStorage.getItem('apiBase') || window.location.origin,
  editingPost: null,
};

// These views require login
const PROTECTED_VIEWS = ['my-posts', 'new-post', 'edit-post'];

// ==================== API ====================
function authBase() {
  return state.apiBase.replace('/api', '');
}

async function api(method, path, body = null, auth = true) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth && state.token) headers['Authorization'] = `Bearer ${state.token}`;

  const res = await fetch(state.apiBase + path, {
    method, headers,
    body: body ? JSON.stringify(body) : undefined
  });

  // If the token has expired, try refreshing it (skipped for guests)
  if (res.status === 401 && auth && state.token && state.refresh) {
    try {
      const r = await fetch(authBase() + '/api/token/refresh/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh: state.refresh })
      });
      if (r.ok) {
        const d = await r.json();
        state.token = d.access;
        localStorage.setItem('access', d.access);
        headers['Authorization'] = `Bearer ${d.access}`;
        return await fetch(state.apiBase + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
      }
    } catch {}
    await logout(false);
    showToast('Your session has expired. Please log in again.', 'error');
  }
  return res;
}

async function logout(callServer = true) {
  const oldRefresh = state.refresh;
  const oldToken = state.token;

  // Clear local state first (avoids an infinite loop)
  state.token = null; state.refresh = null; state.user = null;
  localStorage.removeItem('access'); localStorage.removeItem('refresh'); localStorage.removeItem('user');

  if (callServer && oldRefresh) {
    try {
      await fetch(state.apiBase + '/logout/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${oldToken}` },
        body: JSON.stringify({ refresh: oldRefresh })
      });
    } catch {}
  }
  navigate('feed');
  loadPosts();
}

// ==================== ROUTER ====================
function navigate(view, data = null) {
  if (PROTECTED_VIEWS.includes(view) && !state.token) {
    view = 'login';
    state.error = null; state.success = null;
    state.view = view;
    render();
    showToast('Please log in first', 'error');
    return;
  }
  state.view = view;
  state.error = null; state.success = null;
  if (data) Object.assign(state, data);
  render();
  window.scrollTo(0, 0);
}

function requireLogin(msg = 'Please log in to like or comment') {
  if (state.token) return true;
  navigate('login');
  showToast(msg, 'error');
  return false;
}

// Toast lives outside #app so text typed in a comment box isn't wiped
let toastTimer = null;
function showToast(msg, type = 'success') {
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast ${type}">${escHtml(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, 3000);
}

// ==================== AUTH ====================
async function handleLogin(e) {
  e.preventDefault();
  const form = e.target;
  const username = form.username.value.trim();
  const password = form.password.value;
  state.loading = true; state.error = null; render();

  try {
    const res = await fetch(authBase() + '/api/token/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Login failed');
    state.token = data.access; state.refresh = data.refresh; state.user = username;
    localStorage.setItem('access', data.access);
    localStorage.setItem('refresh', data.refresh);
    localStorage.setItem('user', username);
    state.loading = false;
    navigate('feed');
    loadPosts();
  } catch (err) {
    state.error = err.message; state.loading = false; render();
  }
}

async function handleRegister(e) {
  e.preventDefault();
  const form = e.target;
  const username = form.username.value.trim();
  const password = form.password.value;
  state.loading = true; state.error = null; render();

  try {
    const res = await api('POST', '/register/', { username, password }, false);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Registration failed');
    state.success = 'Account created! You can log in now.'; state.loading = false; render();
    setTimeout(() => navigate('login'), 1500);
  } catch (err) {
    state.error = err.message; state.loading = false; render();
  }
}

// ==================== POSTS ====================
async function loadPosts() {
  state.loading = true; render();
  try {
    const res = await api('GET', '/blog/');
    if (!res.ok) throw new Error('fail');
    const data = await res.json();
    state.posts = Array.isArray(data) ? data : (data.results || []);
    state.loading = false; state.error = null; render();
  } catch {
    state.loading = false; state.error = 'Could not load posts. Is the API running?'; render();
  }
}

async function loadMyPosts() {
  if (!state.token) return;
  state.loading = true; render();
  try {
    const res = await api('GET', `/blog/user/${state.user}/`);
    const data = await res.json();
    state.posts = Array.isArray(data) ? data : (data.results || []);
    state.loading = false; render();
  } catch {
    state.loading = false; state.error = 'Could not load posts.'; render();
  }
}

async function createPost(e) {
  e.preventDefault();
  const form = e.target;
  const title = form.title.value.trim();
  const content = form.content.value.trim();
  if (!title || !content) return;
  state.loading = true; state.error = null; render();

  try {
    const res = await api('POST', '/blog/', { title, content });
    if (!res.ok) throw new Error('Could not create the post');
    state.loading = false;
    showToast('Post published! 🎉');
    navigate('feed'); loadPosts();
  } catch (err) {
    state.error = err.message; state.loading = false; render();
  }
}

async function updatePost(e) {
  e.preventDefault();
  const form = e.target;
  const title = form.title.value.trim();
  const content = form.content.value.trim();
  state.loading = true; render();
  try {
    const res = await api('PUT', `/blog/${state.editingPost.id}/`, { title, content });
    if (!res.ok) throw new Error('Update failed');
    state.loading = false;
    showToast('Post updated!');
    navigate('feed'); loadPosts();
  } catch (err) {
    state.error = err.message; state.loading = false; render();
  }
}

async function deletePost(id) {
  if (!confirm('Are you sure you want to delete this post?')) return;
  try {
    await api('DELETE', `/blog/${id}/`);
    state.posts = state.posts.filter(p => p.id !== id);
    if (state.view === 'detail') navigate('feed');
    showToast('Post deleted.');
    render();
  } catch { showToast('Could not delete the post', 'error'); }
}

async function toggleLike(postId) {
  if (!requireLogin('Please log in to like posts')) return;
  try {
    const res = await api('POST', `/blog/${postId}/like/`);
    const data = await res.json();
    await loadPostsQuiet();
    if (state.currentPost && state.currentPost.id === postId) {
      state.currentPost = state.posts.find(p => p.id === postId) || state.currentPost;
      render();
    }
    showToast(data.message || 'Done!');
  } catch { showToast('Could not like the post', 'error'); }
}

async function loadPostsQuiet() {
  try {
    const res = await api('GET', '/blog/');
    const data = await res.json();
    state.posts = Array.isArray(data) ? data : (data.results || []);
    render();
  } catch {}
}

async function addComment(postId, content) {
  if (!requireLogin('Please log in to comment')) return;
  try {
    const res = await api('POST', `/blog/${postId}/comment/`, { content });
    if (!res.ok) throw new Error('Could not add the comment');
    await loadPostsQuiet();
    state.currentPost = state.posts.find(p => p.id === postId) || state.currentPost;
    showToast('Comment added!');
    render();
  } catch (err) { showToast(err.message, 'error'); }
}

async function deleteComment(commentId, postId) {
  try {
    await api('DELETE', `/comment/${commentId}/delete/`);
    await loadPostsQuiet();
    state.currentPost = state.posts.find(p => p.id === postId) || state.currentPost;
    showToast('Comment deleted.');
    render();
  } catch { showToast('Could not delete the comment', 'error'); }
}

// ==================== HELPERS ====================
function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}

function initials(name) {
  return (name || '?').substring(0, 2).toUpperCase();
}

function escHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ==================== RENDER ====================
function render() {
  const app = document.getElementById('app');
  app.innerHTML = buildHTML();
  attachEvents();
}

function buildHTML() {
  let content = '';
  const isAuthed = !!state.token;
  const logo = `<div class="nav-logo" onclick="navigate('feed'); loadPosts()"><span class="logo-mark">SK</span><span class="logo-text">Blog</span></div>`;

  const nav = isAuthed ? `
    <nav>
      ${logo}
      <div class="nav-right">
        <div class="user-badge"><span>Hi,</span><span class="name">${escHtml(state.user)}</span></div>
        <button class="btn btn-ghost btn-sm" onclick="navigate('feed'); loadPosts()">Feed</button>
        <button class="btn btn-ghost btn-sm" onclick="navigate('my-posts'); loadMyPosts()">My Posts</button>
        <button class="btn btn-primary btn-sm" onclick="navigate('new-post')">+ New</button>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
      </div>
    </nav>` : `
    <nav>
      ${logo}
      <div class="nav-right">
        <button class="btn btn-ghost btn-sm" onclick="navigate('feed'); loadPosts()">Blogs</button>
        <button class="btn btn-ghost btn-sm" onclick="navigate('login')">Login</button>
        <button class="btn btn-primary btn-sm" onclick="navigate('register')">Register</button>
      </div>
    </nav>`;

  if (state.view === 'login') content = buildLogin();
  else if (state.view === 'register') content = buildRegister();
  else if (state.view === 'feed') content = buildFeed();
  else if (state.view === 'detail') content = buildDetail();
  else if (state.view === 'my-posts') content = buildMyPosts();
  else if (state.view === 'new-post') content = buildNewPost();
  else if (state.view === 'edit-post') content = buildEditPost();

  return nav + `<div class="container">${content}</div><footer class="site-footer">© ${new Date().getFullYear()} SK Blog</footer>`;
}

function buildLogin() {
  return `
    <div class="auth-wrap">
      <div class="auth-card">
        <h2>Welcome back 👋</h2>
        <p class="sub">Log in to continue to SK Blog</p>
        ${state.error ? `<div class="error-msg">${escHtml(state.error)}</div>` : ''}
        ${state.success ? `<div class="success-msg">${escHtml(state.success)}</div>` : ''}
        <form id="login-form">
          <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="yourname" required />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required />
          </div>
          <button class="btn btn-primary" style="width:100%;margin-top:4px" type="submit" ${state.loading ? 'disabled' : ''}>
            ${state.loading ? 'Logging in...' : 'Login'}
          </button>
        </form>
        <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--text3)">
          Don't have an account?
          <a href="#" onclick="navigate('register'); return false;" style="color:var(--accent);text-decoration:none;font-weight:600">Register</a>
        </p>
      </div>
    </div>`;
}

function buildRegister() {
  return `
    <div class="auth-wrap">
      <div class="auth-card">
        <h2>Join SK Blog ✨</h2>
        <p class="sub">Create an account and start writing</p>
        ${state.error ? `<div class="error-msg">${escHtml(state.error)}</div>` : ''}
        ${state.success ? `<div class="success-msg">${escHtml(state.success)}</div>` : ''}
        <form id="register-form">
          <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="yourname" required />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Min 8 chars" required />
          </div>
          <button class="btn btn-primary" style="width:100%;margin-top:4px" type="submit" ${state.loading ? 'disabled' : ''}>
            ${state.loading ? 'Creating...' : 'Create Account'}
          </button>
        </form>
        <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--text3)">
          Already have an account?
          <a href="#" onclick="navigate('login'); return false;" style="color:var(--accent);text-decoration:none;font-weight:600">Log in</a>
        </p>
      </div>
    </div>`;
}

function buildFeed() {
  const hero = state.token ? '' : `
    <div class="hero">
      <h1>SK Blog</h1>
      <p>Read stories, share ideas. No login needed to read — create a free account when you want to write, like or comment.</p>
      <button class="btn" onclick="navigate('register')">Join SK Blog</button>
    </div>`;
  return `
    ${hero}
    <div class="page-header">
      <h1>All Posts</h1>
      ${state.token ? `<button class="btn btn-primary btn-sm" onclick="navigate('new-post')">+ Write Post</button>` : ''}
    </div>
    ${state.error ? `<div class="error-msg">${escHtml(state.error)}</div>` : ''}
    ${state.loading ? '<div class="spinner"></div>' : buildPostList(state.posts)}`;
}

function buildMyPosts() {
  return `
    <div class="page-header">
      <h1>My Posts</h1>
      <button class="btn btn-primary btn-sm" onclick="navigate('new-post')">+ Write Post</button>
    </div>
    ${state.error ? `<div class="error-msg">${escHtml(state.error)}</div>` : ''}
    ${state.loading ? '<div class="spinner"></div>' : buildPostList(state.posts, true)}`;
}

function buildPostList(posts, showOwnerActions = false) {
  if (!posts.length) return `<div class="empty"><div class="empty-icon">📝</div><p>No posts yet. Be the first to write one!</p></div>`;
  return `<div class="post-list">${posts.map(p => buildPostCard(p, showOwnerActions)).join('')}</div>`;
}

function buildPostCard(post, showOwnerActions = false) {
  const isOwner = !!state.user && post.author === state.user;
  const commentCount = post.comments ? post.comments.length : 0;
  return `
    <div class="post-card">
      <div class="post-meta">
        <div class="avatar">${initials(post.author)}</div>
        <span class="post-author">${escHtml(post.author)}</span>
        <span class="post-date">${timeAgo(post.created_at)}</span>
      </div>
      <h3 onclick="openPost(${post.id})">${escHtml(post.title)}</h3>
      <div class="post-body preview">${escHtml(post.content)}</div>
      <div class="post-footer">
        <button class="like-btn" onclick="toggleLike(${post.id})">♥ ${post.total_likes || 0}</button>
        <span class="comment-count" onclick="openPost(${post.id})">💬 ${commentCount}</span>
        ${(showOwnerActions && isOwner) ? `
          <div class="owner-actions">
            <button class="btn btn-ghost btn-sm" onclick="editPost(${post.id})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deletePost(${post.id})">Delete</button>
          </div>` : ''}
      </div>
    </div>`;
}

function buildDetail() {
  const post = state.currentPost;
  if (!post) return '<div class="empty"><p>Post not found</p></div>';
  const isOwner = !!state.user && post.author === state.user;
  const comments = post.comments || [];

  const commentBox = state.token ? `
    <div class="comment-form" id="comment-form">
      <textarea id="comment-input" placeholder="Write your comment..."></textarea>
      <button class="btn btn-primary" onclick="submitComment(${post.id})">Post</button>
    </div>` : `
    <div class="login-hint">
      To comment,
      <a onclick="navigate('login')">log in</a> or
      <a onclick="navigate('register')">create an account</a>.
    </div>`;

  return `
    <div class="post-detail">
      <button class="back-btn" onclick="navigate('feed'); loadPosts()">← Back to feed</button>
      <div class="post-meta">
        <div class="avatar">${initials(post.author)}</div>
        <span class="post-author">${escHtml(post.author)}</span>
        <span class="post-date">${timeAgo(post.created_at)}</span>
        ${isOwner ? `
          <div style="margin-left:12px;display:flex;gap:8px">
            <button class="btn btn-ghost btn-sm" onclick="editPost(${post.id})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deletePost(${post.id})">Delete</button>
          </div>` : ''}
      </div>
      <h2>${escHtml(post.title)}</h2>
      <hr class="divider" />
      <div class="post-full-body">${escHtml(post.content)}</div>
      <hr class="divider" />
      <div style="display:flex;gap:12px;align-items:center">
        <button class="like-btn" onclick="toggleLike(${post.id})">♥ ${post.total_likes || 0} Likes</button>
        <span style="color:var(--text3);font-size:13px">💬 ${comments.length} Comments</span>
      </div>
      <hr class="divider" />
      <div class="comments-section">
        <h4>Comments (${comments.length})</h4>
        ${comments.length ? comments.map(c => `
          <div class="comment-item">
            <div class="comment-header">
              <div class="avatar" style="width:24px;height:24px;font-size:10px">${initials(c.author)}</div>
              <span class="comment-author">${escHtml(c.author)}</span>
              <span class="comment-time">${timeAgo(c.created_at)}</span>
              ${(state.user && c.author === state.user) ? `<button class="btn btn-danger btn-sm btn-icon" onclick="deleteComment(${c.id}, ${post.id})" style="margin-left:8px">✕</button>` : ''}
            </div>
            <div class="comment-text">${escHtml(c.content)}</div>
          </div>`).join('') : '<p style="color:var(--text3);font-size:13px">No comments yet. Be the first!</p>'}
        ${commentBox}
      </div>
    </div>`;
}

function buildNewPost() {
  return `
    <div class="new-post-card">
      <h3>✍️ New Post</h3>
      ${state.error ? `<div class="error-msg">${escHtml(state.error)}</div>` : ''}
      <form id="new-post-form">
        <div class="form-group">
          <label>Title</label>
          <input type="text" name="title" placeholder="Post title..." required />
        </div>
        <div class="form-group">
          <label>Content</label>
          <textarea name="content" placeholder="Tell your story..." rows="8" required></textarea>
        </div>
        <div style="display:flex;gap:10px;margin-top:8px">
          <button class="btn btn-primary" type="submit" ${state.loading ? 'disabled' : ''}>
            ${state.loading ? 'Publishing...' : 'Publish Post'}
          </button>
          <button class="btn btn-ghost" type="button" onclick="navigate('feed'); loadPosts()">Cancel</button>
        </div>
      </form>
    </div>`;
}

function buildEditPost() {
  const p = state.editingPost;
  if (!p) return '';
  return `
    <div class="new-post-card">
      <h3>✏️ Edit Post</h3>
      ${state.error ? `<div class="error-msg">${escHtml(state.error)}</div>` : ''}
      <form id="edit-post-form">
        <div class="form-group">
          <label>Title</label>
          <input type="text" name="title" value="${escHtml(p.title)}" required />
        </div>
        <div class="form-group">
          <label>Content</label>
          <textarea name="content" rows="8" required>${escHtml(p.content)}</textarea>
        </div>
        <div style="display:flex;gap:10px;margin-top:8px">
          <button class="btn btn-primary" type="submit" ${state.loading ? 'disabled' : ''}>
            ${state.loading ? 'Saving...' : 'Save Changes'}
          </button>
          <button class="btn btn-ghost" type="button" onclick="navigate('feed'); loadPosts()">Cancel</button>
        </div>
      </form>
    </div>`;
}

// ==================== EVENTS ====================
function attachEvents() {
  const lf = document.getElementById('login-form');
  if (lf) lf.addEventListener('submit', handleLogin);

  const rf = document.getElementById('register-form');
  if (rf) rf.addEventListener('submit', handleRegister);

  const nf = document.getElementById('new-post-form');
  if (nf) nf.addEventListener('submit', createPost);

  const ef = document.getElementById('edit-post-form');
  if (ef) ef.addEventListener('submit', updatePost);
}

function openPost(id) {
  const post = state.posts.find(p => p.id === id);
  if (post) { state.currentPost = post; navigate('detail'); }
}

function editPost(id) {
  if (!requireLogin()) return;
  const post = state.posts.find(p => p.id === id);
  if (post) { state.editingPost = post; navigate('edit-post'); }
}

function submitComment(postId) {
  if (!requireLogin('Please log in to comment')) return;
  const input = document.getElementById('comment-input');
  const content = input ? input.value.trim() : '';
  if (!content) return;
  input.value = '';
  addComment(postId, content);
}

// ==================== INIT ====================
// Everyone (guests included) lands on the feed
navigate('feed');
loadPosts();
</script>
</body>
</html>
